[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherflow"
version = "0.1.0"
description = "Hourly weather data pipeline for five UK cities"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyyaml>=6",
    "pyarrow>=15",
    "python-dotenv>=1.2.4",
    "psycopg[binary]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weatherflow = ["reference/*.csv"]
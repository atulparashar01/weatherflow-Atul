api:
  forecast_url: https://api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  timeout_seconds: 10
  max_retries: 3
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - apparent_temperature
    - precipitation
    - wind_speed_10m
    - weather_code
    - is_day
  timezone: UTC              # always request UTC; derive London time in transform (Task 2.2)

cities:
  - {name: London,     country: England,  latitude: 51.5085, longitude: -0.1257}
  - {name: Manchester, country: England,  latitude: 53.4809, longitude: -2.2374}
  - {name: Birmingham, country: England,  latitude: 52.4814, longitude: -1.8998}
  - {name: Edinburgh,  country: Scotland, latitude: 55.9521, longitude: -3.1965}
  - {name: Cardiff,    country: Wales,    latitude: 51.4800, longitude: -3.1800}

paths:                       # relative to the folder that contains config.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  quarantine_dir: data/quarantine
  dq_reports_dir: docs/dq_reports
  database: data/weather.db
  schema: sql/schema.sql

dim_date:
  start: "2025-01-01"
  end: "2027-12-31"

data_quality:
  temperature_c: {min: -30, max: 45}
  humidity_pct: {min: 0, max: 100}
  feels_like_max_gap_c: 15
  max_data_age_hours: 3
  min_hours_per_run: 24
  cross_source_temp_gap_c: 3    

backfill:
  chunk_days: 7          # fetch history in 7-day pieces
  lag_days: 5            # the archive API trails real time by about 5 days
  pause_seconds: 1       # short pause between requests, to be polite to the free API

incremental:
  overlap_hours: 2       # re-fetch the last 2 hours to catch late corrections
  
weatherapi:                  # second source; the key is in .env, never here
  forecast_url: https://api.weatherapi.com/v1/forecast.json
  days: 1